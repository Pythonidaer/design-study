<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">Swiss International study illustration</title><desc id="desc">Original educational illustration. Consistent alignment and modular grids; Asymmetric sans-serif typography; Contrast through scale and spacing. Not an archival screenshot.</desc><defs><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".3" stop-color="#b0c3d4"/><stop offset=".48" stop-color="#f8fdff"/><stop offset=".52" stop-color="#6d819a"/><stop offset="1" stop-color="#e7eff6"/></linearGradient><linearGradient id="gloss" x2="0" y2="1"><stop stop-color="#c8e5ff"/><stop offset=".49" stop-color="#d52b27"/><stop offset=".51" stop-color="#28519a"/><stop offset="1" stop-color="#d52b27"/></linearGradient><radialGradient id="sun"><stop stop-color="#ffdb82"/><stop offset="1" stop-color="#d52b27"/></radialGradient><pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2.5" fill="#171717"/></pattern><pattern id="grain" width="12" height="8" patternUnits="userSpaceOnUse"><path d="M0 2L12 0M0 7L12 5" stroke="#171717" opacity=".13"/></pattern><pattern id="wood" width="70" height="150" patternUnits="userSpaceOnUse"><rect width="70" height="150" fill="#806141"/><path d="M1 0V150M15 0Q38 40 16 80T20 150M45 0Q25 60 50 95T53 150" fill="none" stroke="#4c3727" stroke-width="3"/></pattern></defs><rect x="0" y="0" width="800" height="500" rx="0" fill="#f5f4ef" stroke="none" stroke-width="1"/><rect x="48" y="48" width="300" height="10" rx="0" fill="#171717" stroke="none" stroke-width="1"/><rect x="410" y="48" width="340" height="220" rx="0" fill="#d52b27" stroke="none" stroke-width="1"/><text x="48" y="128" fill="#171717" font-family="Arial, sans-serif" font-size="76" font-weight="700" >Ways</text><text x="48" y="205" fill="#171717" font-family="Arial, sans-serif" font-size="66" font-weight="700" >of seeing.</text><text x="48" y="280" fill="#171717" font-family="Arial, sans-serif" font-size="16" font-weight="400" >FIELD NOTES / VISUAL STUDIES</text><path d="M48 314L752 314" fill="none" stroke="#171717" stroke-width="2"/><text x="48" y="360" fill="#171717" font-family="Arial, sans-serif" font-size="25" font-weight="400" >Type. Shape. Space.</text><text x="410" y="360" fill="#171717" font-family="Arial, sans-serif" font-size="20" font-weight="400" >A clear structure</text><text x="410" y="392" fill="#171717" font-family="Arial, sans-serif" font-size="20" font-weight="400" >for a complex idea.</text><text x="48" y="455" fill="#171717" font-family="Arial, sans-serif" font-size="15" font-weight="400" >SWISS INTERNATIONAL</text></svg>