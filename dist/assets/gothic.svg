ing="5">FIELD NOTES</text><text x="400" y="240" fill="#e9e4d6" font-family="Georgia, serif" font-size="58" font-weight="400" text-anchor="middle">Ways of seeing.</text><path d="M230 274L570 274" fill="none" stroke="#82718e" stroke-width="2"/><text x="400" y="320" fill="#e9e4d6" font-family="Georgia, serif" font-size="23" font-weight="400" text-anchor="middle">Type, shape and space.</text><text x="400" y="398" fill="#82718e" font-family="Georgia, serif" font-size="21" font-weight="400" text-anchor="middle">Read the study</text></svg>